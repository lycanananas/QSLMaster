name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - run: python -m compileall -q qslmaster_cli qslmaster_gui packaging qslmaster_version.py

      - run: python -m pytest

  gui_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui.txt pytest

      - env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/unit/test_gui_smoke.py

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: |
          VERSION="$(python -c "import qslmaster_version; print(qslmaster_version.SOURCE_VERSION)")"
          python packaging/changelog.py check "$VERSION"
          python packaging/changelog.py debian "$VERSION" > /dev/null
